[package]
name = "vlen"
version = "0.4.4"
edition = "2024"
rust-version = "1.85"
authors = ["Harrison Chin <git@harry.aleeas.com>"]
description = "High-performance variable-length integer encoding with bulk operations, const fn support, and no_std compatibility"
license = "MPL-2.0"
repository = "https://github.com/harrychin/vlen"
keywords = ["encoding", "integer", "varint", "no-std"]
categories = ["encoding", "compression", "no-std"]

[lib]
name = "vlen"
path = "vlen/mod.rs"

[[bench]]
name = "encode_decode"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "bulk"
harness = false

[[bench]]
name = "append"
harness = false
required-features = ["alloc"]

[dependencies]
serde = { version = "1.0", optional = true, default-features = false }
base64 = { version = "0.23", optional = true, default-features = false }

[dev-dependencies]
arbtest = "0.3"
rstest = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", features = ["use-std"] }

[features]
default = []
alloc = []
serde = ["dep:serde", "dep:base64"]
simd = []
full = ["alloc", "serde", "simd"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Benchmark-only dependencies; several do not build for wasm targets.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"
integer-encoding = "4.1"
prost = "0.14"
vint64 = "1.0"
stream-vbyte = "0.4"

[[example]]
name = "wal"
required-features = ["alloc"]
